seed: 42
data:
  raw_path: data/raw/complaints.csv
  label_col: Product
  text_col: Consumer complaint narrative
  min_class_count: 200     # need ~30 per class in val/test (15% each)
  one_row_per_group: true  # about half the narratives are copies of template letters
  sample_size: null        # not needed now, ~98k distinct complaints is small enough
dedupe:
  block_on: [date_received, state, zip, issue]
  prefix_chars: 200        # same block + same first 200 characters = duplicate
  cosine_threshold: 0.80   # ...or TF-IDF cosine at least this high
  max_block_size: 2000     # bigger blocks only use the prefix check (keeps it fast)
split:
  train: 0.70
  val: 0.15
  test: 0.15
tfidf:
  stop_words: [null, english]
  ngram_range: [[1, 1], [1, 2]]
  max_features: [1000, 5000, 10000]
